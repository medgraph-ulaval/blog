baseURL = 'https://firstline.com'
languageCode = 'en-us'
title = 'Medgraph - blog'
theme = 'ananke'

[params]
site_logo = "images/logo_and_label.svg"
favicon = "images/favicon.ico"
title_lottie = "animations/logo_rotate.lottie"

author = "Jordan Mathieu, Louis-Etienne Messier"

defaultContentLangugage = 'en'
defaultContentLangugageInSubdir = false

post_content_classes = "serif tj"

[languages.en]
languageName = 'English'
languageCode = 'en-us'
weight = 1
title = 'Blog'

[languages.fr]
languageName = 'Français'
languageCode = 'fr-ca'
weight = 2
title = "Blogue"

[params.ananke]
custom_css = ["sticky-footer.css"]


[caches]
  [caches.images]
    dir = ':cacheDir/images'